[package]
name = "when-cosmic-applet"
version = "1.0.0"
edition = "2024"
license = "MIT"
description = "COSMIC desktop applet showing Islamic prayer times from the `when` CLI"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time"] }

futures = "0.3"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
features = [
    "applet",
    "tokio",
    "wayland",
]
